name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Clean install - initialise an empty database
        run: |
          cp .env.example .env
          python pipeline.py init --db-path instance/ci.db
          python pipeline.py status --db-path instance/ci.db

      - name: Tests (includes the clean-install smoke test with mocked sources)
        run: pytest -q cyber_data_collector/tests
